<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lektionspuls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9F1F8;--card:#FFFFFF;--ink:#13293D;--ink2:#4A6075;--line:#C9D8E6;
--vakna:#F2B632;--on-vakna:#2A1E00;--lugna:#2D6FA6;--on-lugna:#FFFFFF;--energi:#277A4D;--on-energi:#FFFFFF;--soft:#F3F8FC;--sky:#9BDDFF;--ground:#5FCB6A;--wall:#CDEFE6;--wall2:#7ED6C6;--floor:#E8B77B;--floor2:#C98F4F;--rug:#FF6B6B;--hill:#7BD389;--hill2:#4FBF6B;--sky1:#35B6F5;--sky2:#BDEBFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B27;--card:#172636;--ink:#E6EEF6;--ink2:#9FB3C5;--line:#2B4054;--soft:#122030;
--vakna:#F2B632;--on-vakna:#2A1E00;--lugna:#7DB5E3;--on-lugna:#0B2236;--energi:#6CC79A;--on-energi:#06271A;--sky:#24507A;--ground:#2D6B3F;--wall:#27414A;--wall2:#1F5F58;--floor:#6B4B2D;--floor2:#523820;--rug:#A8323A;--hill:#2F7A4A;--hill2:#276B3F;--sky1:#0E2A52;--sky2:#2B5C94}}
:root[data-theme="dark"]{--bg:#0F1B27;--card:#172636;--ink:#E6EEF6;--ink2:#9FB3C5;--line:#2B4054;--soft:#122030;
--vakna:#F2B632;--on-vakna:#2A1E00;--lugna:#7DB5E3;--on-lugna:#0B2236;--energi:#6CC79A;--on-energi:#06271A;--sky:#24507A;--ground:#2D6B3F;--wall:#27414A;--wall2:#1F5F58;--floor:#6B4B2D;--floor2:#523820;--rug:#A8323A;--hill:#2F7A4A;--hill2:#276B3F;--sky1:#0E2A52;--sky2:#2B5C94}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;margin:0;line-height:1.1}
#app{max-width:600px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
h1{font-size:34px;font-weight:800}
.sub{margin:0 0 18px;color:var(--ink2);font-size:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.q{font-family:'Baloo 2','Nunito',sans-serif;font-weight:700;font-size:20px;margin:0 0 10px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:12px 16px;min-height:56px;cursor:pointer;flex:1 1 auto;text-align:center}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.g-vakna.on{background:var(--vakna);color:var(--on-vakna);border-color:var(--vakna)}
.chip.g-lugna.on{background:var(--lugna);color:var(--on-lugna);border-color:var(--lugna)}
.chip.g-energi.on{background:var(--energi);color:var(--on-energi);border-color:var(--energi)}
.chip small{display:block;font-weight:600;font-size:13px;opacity:.85}
.btn{font:inherit;font-family:'Baloo 2','Nunito',sans-serif;font-weight:700;font-size:22px;border:0;border-radius:16px;padding:14px 20px;min-height:60px;width:100%;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn2{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 16px;min-height:56px;cursor:pointer;flex:1}
.link{font:inherit;font-weight:700;background:none;border:0;color:var(--ink);text-decoration:underline;padding:10px 4px;min-height:44px;cursor:pointer}
.row{display:flex;gap:10px}
button:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.sw button{min-width:92px}
.exhead{border-radius:18px 18px 0 0;padding:16px;margin:-16px -16px 14px}
.exhead.vakna{background:var(--vakna);color:var(--on-vakna)}
.exhead.lugna{background:var(--lugna);color:var(--on-lugna)}
.exhead.energi{background:var(--energi);color:var(--on-energi)}
.exhead h2{font-size:32px;font-weight:800}
.exhead p{margin:4px 0 0;font-weight:700;font-size:15px}
ol.steg{margin:0 0 14px;padding:0 0 0 1.4em;font-size:19px;font-weight:600}
ol.steg li{margin-bottom:10px;padding-left:4px}
.alla{background:var(--soft);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.alla b{font-family:'Baloo 2','Nunito',sans-serif;font-size:18px}
.note{color:var(--ink2);font-size:15px;margin:0 0 12px}
.clock{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:96px;text-align:center;line-height:1;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.done{text-align:center;padding:10px 0 4px}
.done h2{font-size:34px;margin-bottom:6px}
details{margin-top:6px}
summary{cursor:pointer;font-weight:700;padding:12px 0;min-height:44px}
.fine{color:var(--ink2);font-size:14px;margin-top:14px}
.xbtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:5;font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;min-height:44px;cursor:pointer;opacity:.85}

/* Bilder och animationer */
.scene{width:100%;height:auto;display:block;border-radius:14px;border:2px solid var(--line);margin:0 0 4px;font-family:'Nunito',system-ui,sans-serif}
.art{margin-bottom:10px}
.exgrid{display:block}
.scene text{user-select:none}
.scene .lb{font-size:10px;font-weight:700;fill:var(--ink)}
.scene .big{font-size:15px;font-weight:800;fill:#13293D}
.scene.paused *{animation-play-state:paused!important}
.kid .al,.kid .ar,.kid .ll,.kid .lr,.pl,.tr,.bl{transform-box:fill-box;transform-origin:50% 0}
.pl,.bl{transform-origin:50% 50%}
.tr{transform-origin:50% 100%}
.sw{animation:swingA var(--d,1.2s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.au{animation:armUp var(--d,6s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.fz{animation:armFz var(--d,5s) linear infinite}
.bn{animation:bounce var(--d,1s) ease-in-out infinite}
.sy{animation:sway var(--d,2s) ease-in-out infinite}
.wk{animation:walk var(--d,4s) ease-in-out infinite alternate}
.gr{animation:grow var(--d,6s) ease-in-out infinite}
.ju{animation:jump var(--d,1.4s) ease-in-out infinite}
.dn{animation:dancebody var(--d,5s) linear infinite}
.cl{animation:climb var(--d,6s) ease-in-out infinite alternate}
.sq{animation:squeeze var(--d,2s) ease-in-out infinite}
.sp{animation:spin 14s linear infinite}
.dr{animation:drop 1.6s linear infinite}
.pu{animation:pulse var(--d,3s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.bal{animation:balloon 5s ease-in-out infinite}
.say{animation:say 1.6s ease-in-out infinite;animation-delay:var(--dl,0s)}
.fzt{animation:fzText 5s ease-in-out infinite}
.nt{animation:noteUp 5s ease-in infinite;animation-delay:var(--dl,0s)}
.tx{animation:txt 5s ease-in-out infinite;animation-delay:var(--dl,0s)}
.tx2{animation:txt 2s ease-in-out infinite;animation-delay:var(--dl,0s)}
.wv{animation:wave 3s linear infinite}
.sm{animation:swim var(--d,6s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.bb{animation:bob var(--d,2s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.wd{animation:wind 2.4s ease-in-out infinite;animation-delay:var(--dl,0s)}
.sd{animation:soundw 2s ease-in-out infinite;animation-delay:var(--dl,0s)}
.tdr{animation:treeSway var(--d,2s) ease-in-out infinite}
@keyframes swingA{0%,100%{transform:rotate(var(--a0,0deg))}50%{transform:rotate(var(--a1,0deg))}}
@keyframes armUp{0%,35%{transform:rotate(var(--a0,0deg))}70%,100%{transform:rotate(var(--a1,0deg))}}
@keyframes armFz{0%,20%,40%{transform:rotate(var(--a0))}10%,30%,50%,60%,100%{transform:rotate(var(--a1))}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--h,-8px))}}
@keyframes sway{0%,100%{transform:rotate(calc(var(--r,8deg) * -1))}50%{transform:rotate(var(--r,8deg))}}
@keyframes treeSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes walk{from{transform:translateX(var(--x0,-60px))}to{transform:translateX(var(--x1,60px))}}
@keyframes grow{0%{transform:scale(1,.5)}50%,85%{transform:scale(1,1)}100%{transform:scale(1,.5)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.08,.88)}40%{transform:translateY(-34px) scale(.96,1.04)}70%{transform:translateY(0) scale(1.08,.88)}}
@keyframes dancebody{0%{transform:rotate(-7deg)}10%{transform:rotate(7deg) translateY(-6px)}20%{transform:rotate(-7deg)}30%{transform:rotate(7deg) translateY(-6px)}40%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-6px)}60%,100%{transform:rotate(5deg)}}
@keyframes climb{from{transform:translate(0,0)}to{transform:translate(var(--cx,125px),var(--cy,-96px))}}
@keyframes squeeze{0%,100%{transform:scale(1)}45%,60%{transform:scale(.93,1.03)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drop{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(120px);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes balloon{0%,100%{transform:scale(.55)}45%{transform:scale(1.4)}}
@keyframes say{0%,30%{opacity:0}35%,75%{opacity:1}80%,100%{opacity:0}}
@keyframes fzText{0%,58%{opacity:0}62%,95%{opacity:1}100%{opacity:0}}
@keyframes noteUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}60%{transform:translateY(-40px);opacity:0}100%{opacity:0}}
@keyframes txt{0%,47%{opacity:1}48%,97%{opacity:0}98%,100%{opacity:1}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-40px)}}
@keyframes swim{0%,100%{transform:translateX(0)}50%{transform:translateX(110px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wind{0%{transform:translateX(-10px);opacity:0}30%{opacity:1}100%{transform:translateX(80px);opacity:0}}
@keyframes soundw{0%,100%{opacity:.1}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.scene *{animation-play-state:paused!important}}
@media (min-width:900px){body.board .exgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:3vw;align-items:start}}

.mas{animation:mbob 1.7s ease-in-out infinite}
.mas.cheer{animation:cheer .85s ease-out}
.mw{animation:mwave .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.cd{animation:cdrift 16s ease-in-out infinite alternate}
.cf{animation:confetti 1.1s ease-out forwards}
.pop{animation:popT .95s ease-out forwards}
@keyframes mbob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
@keyframes cheer{0%{transform:translateY(0) scale(1) rotate(0)}30%{transform:translateY(-20px) scale(1.3) rotate(-16deg)}60%{transform:translateY(-8px) scale(1.2) rotate(14deg)}100%{transform:translateY(0) scale(1) rotate(0)}}
@keyframes mwave{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes cdrift{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
@keyframes confetti{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rt)) scale(1);opacity:0}}
@keyframes popT{0%{transform:translateY(0) scale(.3);opacity:0}25%{transform:translateY(-6px) scale(1.25);opacity:1}70%{transform:translateY(-14px) scale(1);opacity:1}100%{transform:translateY(-26px) scale(1);opacity:0}}

.tw{animation:twk 2.4s ease-in-out infinite}
.bub{animation:bubUp calc(5s*var(--tempo,1.8)) ease-in infinite}
.sw2{transform-box:fill-box;transform-origin:50% 100%;animation:swayW calc(3s*var(--tempo,1.8)) ease-in-out infinite alternate}
.sn{animation:snowF calc(4s*var(--tempo,1.8)) linear infinite}
.on .rkt{animation:rktUp calc(2.2s*var(--tempo,1.8)) ease-in forwards}
.flm{animation:flick .2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes twk{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes bubUp{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-110px);opacity:0}}
@keyframes swayW{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes snowF{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(10px,150px);opacity:0}}
@keyframes rktUp{0%{transform:translateY(0)}100%{transform:translateY(-190px)}}
@keyframes flick{from{transform:scaleY(.8)}to{transform:scaleY(1.3)}}

/* Djur */
.tur{animation:turWalk calc(10s*var(--tempo,1.8)) ease-in-out infinite alternate}.tur.tur-h{animation:none}
.tl{animation:legStep calc(1.8s*var(--tempo,1.8)) ease-in-out infinite;animation-delay:calc(var(--dl,0s)*var(--tempo,1.8));transform-box:fill-box;transform-origin:50% 10%}
.tur-h .tl{animation:legHide calc(8s*var(--tempo,1.8)) ease-in-out infinite}
.th{animation:headBob calc(2.4s*var(--tempo,1.8)) ease-in-out infinite;transform-box:fill-box;transform-origin:20% 60%}
.thide{animation:headHide calc(8s*var(--tempo,1.8)) ease-in-out infinite;transform-box:fill-box;transform-origin:10% 70%}
.bear{animation:breath calc(4s*var(--tempo,1.8)) ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.zzz{animation:zzzUp calc(2.6s*var(--tempo,1.8)) ease-in infinite;animation-delay:calc(var(--dl,0s)*var(--tempo,1.8))}
.ele,.gir{animation:eleStomp calc(1.6s*var(--tempo,1.8)) ease-in-out infinite}
.ear{animation:earFlap calc(1.6s*var(--tempo,1.8)) ease-in-out infinite alternate;transform-box:fill-box;transform-origin:90% 30%}
.trunk{animation:trunkSwing calc(2.2s*var(--tempo,1.8)) ease-in-out infinite alternate;transform-box:fill-box;transform-origin:80% 5%}
.mou{animation:mouTip calc(1s*var(--tempo,1.8)) ease-in-out infinite}
.mear{animation:earTw calc(1.4s*var(--tempo,1.8)) ease-in-out infinite;animation-delay:calc(var(--dl,0s)*var(--tempo,1.8));transform-box:fill-box;transform-origin:50% 100%}
.frog,.kan{animation:frogJump calc(1.8s*var(--tempo,1.8)) ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.bfloat{animation:bfloat calc(5s*var(--tempo,1.8)) ease-in-out infinite}
.wl{animation:flapL calc(.9s*var(--tempo,1.8)) ease-in-out infinite alternate}.wr{animation:flapR calc(.9s*var(--tempo,1.8)) ease-in-out infinite alternate}
.gneck{animation:gSway calc(3.6s*var(--tempo,1.8)) ease-in-out infinite;transform-box:fill-box;transform-origin:60% 100%}
.lmouth{animation:yawnM calc(4s*var(--tempo,1.8)) ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0%}
.ctail{animation:tailSwish calc(2.2s*var(--tempo,1.8)) ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}
.cat{animation:catStretch calc(3.4s*var(--tempo,1.8)) ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.marm{animation:armSw calc(1.2s*var(--tempo,1.8)) ease-in-out infinite alternate;animation-delay:calc(var(--dl,0s)*var(--tempo,1.8));transform-box:fill-box;transform-origin:50% 0%}
.mon{animation:monBounce calc(1.2s*var(--tempo,1.8)) ease-in-out infinite}
.bird{animation:birdBob calc(2.4s*var(--tempo,1.8)) ease-in-out infinite}
.bwing{animation:wingFlap calc(.8s*var(--tempo,1.8)) ease-in-out infinite alternate;transform-box:fill-box;transform-origin:10% 80%}
.fsh{animation:fishSwim calc(5s*var(--tempo,1.8)) ease-in-out infinite alternate}
@keyframes turWalk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes legStep{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes legHide{0%,15%{transform:scale(1)}30%,70%{transform:scale(.15)}85%,100%{transform:scale(1)}}
@keyframes headBob{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(4px) rotate(-4deg)}}
@keyframes headHide{0%,15%{transform:translateX(0) scale(1)}30%,70%{transform:translateX(-24px) scale(.4)}85%,100%{transform:translateX(0) scale(1)}}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.045,1.03)}}
@keyframes zzzUp{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(12px,-26px) scale(1.2);opacity:0}}
@keyframes eleStomp{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes earFlap{from{transform:rotate(8deg)}to{transform:rotate(-14deg)}}
@keyframes trunkSwing{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
@keyframes mouTip{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes earTw{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-14deg)}90%{transform:rotate(8deg)}}
@keyframes frogJump{0%,100%{transform:translateY(0) scale(1.08,.86)}40%{transform:translateY(-26px) scale(.95,1.1)}70%{transform:translateY(0) scale(1.1,.84)}85%{transform:translateY(0) scale(1,1)}}
@keyframes bfloat{0%,100%{transform:translate(0,0)}25%{transform:translate(14px,-10px)}50%{transform:translate(0,-4px)}75%{transform:translate(-14px,-12px)}}
@keyframes flapL{from{transform:scaleX(1)}to{transform:scaleX(.2)}}
@keyframes flapR{from{transform:scaleX(1)}to{transform:scaleX(.2)}}
@keyframes gSway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes yawnM{0%,20%{transform:scaleY(.1)}45%,70%{transform:scaleY(1.1)}90%,100%{transform:scaleY(.1)}}
@keyframes tailSwish{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes catStretch{0%,100%{transform:scale(1)}40%{transform:scale(1.14,.88)}70%{transform:scale(.94,1.1)}}
@keyframes armSw{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes monBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes birdBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wingFlap{from{transform:rotate(-32deg)}to{transform:rotate(24deg)}}
@keyframes fishSwim{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.tripsvg{width:100%;height:auto;display:block;border-radius:12px;border:2px solid var(--line);margin-bottom:8px}
.pbar{height:14px;border-radius:8px;background:var(--line);overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#FFD23F,#FF8C42);transition:width .9s}
.tmini{display:flex;align-items:center;gap:10px;font-weight:800;margin:-4px 0 10px}.tmini .pbar{flex:1;margin:0}
.starbtn{width:100%;margin-top:10px;background:#FFD23F!important;color:#2A1E00!important;border-color:#E0A800!important;font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:19px}
.starbtn[disabled]{opacity:.7;cursor:default}
.cele{position:fixed;inset:0;background:rgba(10,20,40,.82);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;overflow:hidden}
.cele .box{background:var(--card);border-radius:20px;max-width:520px;width:100%;padding:16px;text-align:center;position:relative;z-index:2}
.cft{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:cfall 2.4s linear infinite}
.mbob{animation:bob 1s ease-in-out infinite}.wd2{transform-box:fill-box;transform-origin:0 50%;animation:flagw .6s ease-in-out infinite alternate}
@keyframes cfall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(540deg)}}
@keyframes flagw{from{transform:scaleX(1)}to{transform:scaleX(.75)}}
.moods{display:grid;gap:10px}
.mood{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid #2B2140;border-radius:16px;padding:12px 14px;min-height:76px;cursor:pointer;font:inherit}
.mood b{display:block;font-family:'Baloo 2','Nunito',sans-serif;font-size:22px;line-height:1.1}.mood small{display:block;font-size:14px;font-weight:600;opacity:.9}
.mood .mi{font-size:34px;line-height:1}

<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const MAL={vakna:{n:'Vakna',d:'Klassen är trött eller seg'},lugna:{n:'Lugna sig',d:'Det är stökigt eller spänt'},energi:{n:'Bränna energi',d:'Klassen behöver röra sig'}};
const PLATS=[{n:'Vid bänken',d:'Ingen plats behövs'},{n:'Fritt golv',d:'Plats i klassrummet'},{n:'Ute',d:'Skolgård eller grönområde'}];

/* krav: 0 = vid bänken, 1 = fritt golv, 2 = ute. tider = minuter övningen passar för. */
const EX=[
{id:'blomman',namn:'Blomman som vaknar',mal:'vakna',krav:0,tider:[2,3],miljo:true,intro:'Från frö till blomma.',steg:['Sitt eller stå. Gör er små som ett frö med händerna i knät.','Solen kommer fram. Växa sakta och sträck upp armarna.','Det börjar regna. Låt fingrarna dansa ner som regndroppar.','Sträck ut bladen och ta tre stora andetag.'],alla:'Gör hela övningen sittande. Armarna räcker.'},
{id:'eko',namn:'Eko-klapp',mal:'vakna',krav:0,tider:[2,3,5],miljo:false,intro:'Klappa efter, precis likadant.',steg:['Läraren klappar ett kort mönster.','Klassen klappar tillbaka precis likadant.','Gör mönstret längre. Klappa sedan på knäna och stampa.','Låt en elev hitta på nästa mönster.'],alla:'Man kan klappa på bordet eller knäna i stället för att stå.'},
{id:'tradet',namn:'Trädet i vinden',mal:'vakna',krav:0,tider:[2,3],miljo:true,intro:'Rötter i golvet, grenar i luften.',steg:['Stå bakom stolen. Armarna är grenar och fötterna är rötter.','Lätt vind: vicka försiktigt på grenarna.','Kraftig vind: svaja med hela kroppen. Rötterna sitter fast.','Stormen lägger sig. Stå stilla som ett träd.'],alla:'Sitt ner och svaja med överkroppen.'},
{id:'skaka',namn:'Skaka ut',mal:'vakna',krav:0,tider:[2],miljo:false,intro:'Väck kroppen del för del.',steg:['Skaka händerna i tio sekunder.','Skaka armarna, sedan axlarna.','Skaka ena foten, sedan den andra.','Skaka hela kroppen och avsluta med ett stort pust.'],alla:'Skaka de delar av kroppen som känns bra.'},
{id:'farg',namn:'Hitta färgen',mal:'vakna',krav:1,tider:[3,5],miljo:false,intro:'Gå tyst och hitta en färg.',steg:['Läraren säger en färg.','Alla går tyst och rör vid något i rummet med den färgen.','Gå tillbaka till platsen. Läraren säger nästa färg.','Gör fem färger.'],alla:'Peka på färgen från platsen eller gå tillsammans med en kompis.'},
{id:'ballong',namn:'Ballongandning',mal:'lugna',krav:0,tider:[2,3],miljo:false,intro:'Andas som en ballong.',steg:['Håll händerna runt en tänkt ballong vid magen.','Andas in genom näsan så att ballongen blir stor.','Andas ut långsamt genom munnen så att luften går ur.','Gör det fem gånger.'],alla:'Den som inte vill blunda tittar på bordet.'},
{id:'ljud',namn:'Lyssna på ljuden',mal:'lugna',krav:0,tider:[3,5],miljo:true,intro:'Hur många ljud hör du?',steg:['Sitt bekvämt. Blunda eller titta ner.','Lyssna på ljuden i rummet. Håll upp ett finger för varje ljud.','Lyssna nu på ljud utanför rummet.','Öppna ögonen och berätta ett ljud för en kompis.'],alla:'Man får titta ner i stället för att blunda.'},
{id:'slowmotion',namn:'Slow motion',mal:'lugna',krav:1,tider:[2,3,5],miljo:false,intro:'Allt går väldigt långsamt.',steg:['Hitta en plats på golvet där du inte rör någon.','Gå som om luften vore tjock sirap.','Byt till att gå som en sköldpadda och sedan som en sovande björn.','Stanna och andas ut.'],alla:'Rör armarna i slow motion från platsen.'},
{id:'spann',namn:'Spänn och släpp',mal:'lugna',krav:0,tider:[2,3],miljo:false,intro:'Hårt som sten, mjukt som gelé.',steg:['Kramma händerna hårt som stenar i fem sekunder. Släpp.','Dra upp axlarna mot öronen. Släpp.','Spänn magen som en sten. Släpp.','Skaka ut och ta ett stort andetag.'],alla:'Hoppa över det som känns obekvämt.'},
{id:'regn',namn:'Regnskuren',mal:'lugna',krav:0,tider:[2,3],miljo:true,intro:'Ett regn som växer och lägger sig.',steg:['Gnugga handflatorna mot varandra: det börjar droppa.','Knäpp med fingrarna: regnet tilltar.','Klappa på knäna: kraftigt regn. Stampa lätt: åska.','Gör det baklänges tills det blir alldeles tyst.'],alla:'Använd bara händerna.'},
{id:'sinnen',namn:'Sinnespromenad',mal:'lugna',krav:2,tider:[5],miljo:true,intro:'Gå ut och använd sinnena.',steg:['Gå ut och gå tyst i en lång rad.','Stanna och lyssna: vad hör du?','Titta efter något litet i naturen. Rör inte levande växter eller djur.','Känn på luften. Berätta en sak för en kompis.'],alla:'Man kan sitta på en bänk och ändå vara med.'},
{id:'djur',namn:'Djurparad',mal:'energi',krav:1,tider:[3,5],miljo:false,intro:'Rör er som olika djur.',steg:['Se till att alla har plats runt sig.','Gå som en elefant. Sedan som en mus.','Hoppa som en groda. Fladdra som en fjäril.','Låt barnen föreslå fler djur.'],alla:'Gör djurens rörelser med armarna.'},
{id:'flod',namn:'Floden och stenarna',mal:'energi',krav:1,tider:[3,5],miljo:true,intro:'Golvet är en flod.',steg:['Golvet är en flod. Simma runt som fiskar utan att nudda varandra.','När läraren säger "sten" fryser alla.','Vid "ström" simmar alla åt andra hållet.','Avsluta med att fiskarna vilar på botten.'],alla:'Simma med armarna från platsen.'},
{id:'frys',namn:'Frys-dans',mal:'energi',krav:1,tider:[2,3,5],miljo:false,intro:'Dansa tills musiken stannar.',steg:['Sätt på musik eller klappa en takt.','Alla dansar fritt.','När musiken stannar fryser alla.','Byt stil några gånger: långsamt, snabbt, litet, stort.'],alla:'Dansa med armar och huvud från stolen.'},
{id:'skrap',namn:'Skräpplockarna',mal:'energi',krav:1,tider:[3,5],miljo:true,intro:'Sortera tänkt skräp.',steg:['Visa tre tänkta kärl: papper, plast och matavfall.','Läraren säger ett föremål, till exempel bananskal, tidning eller flaska.','Barnen låtsas plocka upp det och går snabbt till rätt kärl.','Prata kort: vad kan vi göra för att det blir mindre skräp?'],alla:'Peka på rätt kärl.'},
{id:'berg',namn:'Bergsklättring',mal:'energi',krav:0,tider:[2,3],miljo:true,intro:'Upp på berget och ner igen.',steg:['Stå vid bänken och marschera på stället.','Klättra uppför ett berg med armarna.','Titta ut över utsikten och sträck armarna ut.','Klättra ner och ta tre andetag.'],alla:'Gör rörelserna sittande.'},
{id:'skatt',namn:'Naturskattjakt',mal:'energi',krav:2,tider:[5],miljo:true,intro:'Hitta mjukt, hårt och runt.',steg:['Gå ut. Ge klassen tre saker att hitta: något mjukt, något hårt och något runt.','Titta och peka. Plocka inte levande växter eller djur.','Samlas och berätta vad ni hittade.','Gå lugnt in igen.'],alla:'Peka och leta tillsammans med en kompis.'}
];

const S=Object.assign({tid:3,mal:'vakna',plats:0,miljo:false},load('lp_val',{}));
S.tempo=load('lp_tempo',1.8);S.sound=load('lp_sound',true);S.music=load('lp_music',true);S.trip=Object.assign({type:'raket',goal:25,stars:0,done:0},load('lp_trip',{}));S.starGiven=false;S.celebrate=false;S.resetArm=false;S.tripShown=S.trip.stars;S.map=load('lp_map',null);S.used=load('lp_used',{});S.seq=Math.max(0,...Object.values(S.used));S.skip=[];S.prevUsed=null;S.mapShown=null;S.album=load('lp_album',{});S.mission=false;S.lastMission=load('lp_mission',null);S.reveal=null;S.viewCard=null;S.afterReveal=false;S.screen='setup';S.artPaused=false;S.cur=null;S.recent=[];S.board=false;S.timer=null;
let tick=null,ctx=null;

function candidates(){
  const f=(useTid)=>EX.filter(e=>e.mal===S.mal&&e.krav<=S.plats&&(!S.miljo||e.miljo)&&(!useTid||e.tider.includes(S.tid)));
  let l=f(true);if(!l.length)l=f(false);if(!l.length)l=EX.filter(e=>e.mal===S.mal&&e.krav<=S.plats);
  return l}
function pick(){
  const l=candidates();if(!l.length)return null;
  let pool=l.filter(e=>!S.skip.includes(e.id));if(!pool.length){S.skip=[];pool=l}
  const min=Math.min(...pool.map(e=>S.used[e.id]||0));
  const least=pool.filter(e=>(S.used[e.id]||0)===min);
  return least[Math.floor(Math.random()*least.length)]}
function chime(){if(!S.sound)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach((t,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=[523,659,784][i];o.type='sine';g.gain.setValueAtTime(.0001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,ctx.currentTime+t+.05);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.6);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.65)})}catch(e){}}
function mmss(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function stopTimer(){if(tick){clearInterval(tick);tick=null}S.timer=null}
function startTimer(){
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}
  stopTimer();S.timer={end:Date.now()+S.tid*60000,left:S.tid*60,paused:false,done:false};
  tick=setInterval(()=>{const t=S.timer;if(!t||t.paused)return;t.left=(t.end-Date.now())/1000;
    if(t.left<=0){t.done=true;clearInterval(tick);tick=null;chime();render();return}
    const el=$('#clock');if(el)el.textContent=mmss(t.left)},250);
  render()}
function pauseTimer(){const t=S.timer;if(!t)return;if(t.paused){t.end=Date.now()+t.left*1000;t.paused=false}else{t.left=(t.end-Date.now())/1000;t.paused=true}render()}
function enterBoard(){S.board=true;document.body.classList.add('board');try{const e=document.documentElement;if(e.requestFullscreen)e.requestFullscreen().catch(()=>{})}catch(e){}render()}
function exitBoard(){S.board=false;document.body.classList.remove('board');try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()}catch(e){}render()}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&S.board){S.board=false;document.body.classList.remove('board');render()}});

 {skin:'#F7CFA6',hair:'#6B3E26',hs:'short',shirt:'#FF5A5F',stripe:'#FFFFFF',pants:'#2D6CDF',shoe:'#FFD23F',star:1},
 {skin:'#9A5F3F',hair:'#1B120D',hs:'curly',shirt:'#1FC77E',stripe:'#FFFFFF',pants:'#4B3F8F',shoe:'#FF5A5F',acc:'band'},
 {skin:'#FBDCC0',hair:'#E8B04B',hs:'pony',shirt:'#9B5DE5',stripe:'#F15BB5',pants:'#2D6CDF',shoe:'#00BBF9',acc:'bow'},
 {skin:'#D49A6A',hair:'#2A1B12',hs:'bun',shirt:'#FFC43D',stripe:'#FF8C42',pants:'#00A6A6',shoe:'#FF5A5F',star:1},
 {skin:'#EFC39C',hair:'#9A4E2B',hs:'short',shirt:'#00BBF9',stripe:'#FFFFFF',pants:'#5B5F97',shoe:'#FFC43D',acc:'beanie'},
 {skin:'#EBC09A',hair:'#7A4A2B',hs:'bun',shirt:'#00A6A6',stripe:'',pants:'#4A4A68',shoe:'#9B5DE5',acc:'glasses'}
];
const CAP=(c)=>`<path d="M-18 -18 C-19.5 -42 19.5 -42 18 -18 C14 -30 6 -27 -1 -29.5 C-9 -27 -14.5 -26 -18 -18Z" fill="${c}" ${OL}/>`;

};

 band:()=>`<path d="M-17.5 -26 Q0 -36 17.5 -26" stroke="#FFD23F" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M-17.5 -26 Q0 -36 17.5 -26" stroke="#2B2140" stroke-width=".8" fill="none" opacity=".4"/>`,
 glasses:()=>`<circle cx="-6.8" cy="-18" r="6.8" fill="rgba(255,255,255,.28)" stroke="#2B2140" stroke-width="1.5"/><circle cx="6.8" cy="-18" r="6.8" fill="rgba(255,255,255,.28)" stroke="#2B2140" stroke-width="1.5"/><path d="M-0 -18h0" stroke="#2B2140" stroke-width="1.5"/>`
};
function rigMarkup(i,L){
  const sk=L.skin,sh=L.shirt,pa=L.pants,hr=L.hair,shoe=L.shoe;
  const shirtPath='M-13 -39 Q-18 -37 -17 -29 L-14.5 -3 Q0 3 14.5 -3 L17 -29 Q18 -37 13 -39 Q0 -43 -13 -39Z';
  const arm=(side)=>`<g data-j="arm${side}"><rect x="-5.3" y="-2" width="10.6" height="25" rx="5.3" fill="${sk}" ${OL}/><rect x="-6.6" y="-3" width="13.2" height="13" rx="5.6" fill="${sh}" ${OL}/><g data-j="fore${side}" transform="translate(0 22)"><rect x="-4.6" y="-2" width="9.2" height="22" rx="4.6" fill="${sk}" ${OL}/><circle cy="22" r="5.8" fill="${sk}" ${OL}/><circle r="4.9" fill="${sk}"/></g></g>`;
  const leg=(side)=>{const dx=side==='L'?-1.5:1.5;return `<g data-j="leg${side}"><rect x="-6.6" y="-4" width="13.2" height="53" rx="6.2" fill="${pa}" ${OL}/><ellipse cx="${dx}" cy="50" rx="9.2" ry="5.2" fill="${shoe}" ${OL}/><path d="M${dx-7} 52.6 Q${dx} 56 ${dx+7} 52.6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></g>`};
  const stripes=L.stripe?`<clipPath id="cs${i}"><path d="${shirtPath}"/></clipPath><g clip-path="url(#cs${i})"><rect x="-20" y="-31" width="40" height="5" fill="${L.stripe}"/><rect x="-20" y="-19" width="40" height="5" fill="${L.stripe}"/><rect x="-20" y="-7" width="40" height="5" fill="${L.stripe}"/></g>`:'';
  const star=L.star?`<path d="M0 -26l2.6 5.2 5.7.8-4.1 4 1 5.7L0 -15.5l-5.1 2.7 1-5.7-4.1-4 5.7-.8z" fill="#fff" opacity=".95"/>`:'';
  return `<g data-kid="${i}"><ellipse cx="0" cy="2" rx="28" ry="5.5" fill="#000" opacity=".18"/><g data-j="body">`
   +leg('L')+leg('R')
   +`<g data-j="torso"><rect x="-14.5" y="-7" width="29" height="14" rx="6" fill="${pa}" ${OL}/><rect x="-4.8" y="-47" width="9.6" height="11" rx="3" fill="${sk}" ${OL}/><path d="${shirtPath}" fill="${sh}" ${OL}/>${stripes}${star}`

const V={
setup(){return `<div class="top"><h1>Lektionspuls</h1></div>
<p class="sub">Korta rörelsepauser för klassrummet. Du väljer, klassen rör sig. Eleverna behöver ingen telefon.</p>
${mapCard()}${fridayCard()}${mondayCard()}${albumTeaser()}
<div class="card"><p class="q">Hur lång paus?</p><div class="chips">${[2,3,5].map(m=>`<button class="chip ${S.tid===m?'on':''}" data-tid="${m}" aria-pressed="${S.tid===m}">${m} minuter</button>`).join('')}</div></div>
<div class="card"><p class="q">Var är ni?</p><div class="chips">${PLATS.map((p,i)=>`<button class="chip ${S.plats===i?'on':''}" data-plats="${i}" aria-pressed="${S.plats===i}">${p.n}<small>${p.d}</small></button>`).join('')}</div>
<div class="sw" style="margin-top:8px"><span>Bara övningar med natur och miljö</span><button class="chip ${S.miljo?'on':''}" data-miljo="1" aria-pressed="${S.miljo}">${S.miljo?'Ja':'Nej'}</button></div></div>
${moodCard()}
<details><summary>Så visar du den på smartboarden</summary>
<p class="note">Öppna den här sidan i smartboardens webbläsare, eller visa telefonen på tavlan med skärmspegling. Hur man speglar skiljer sig mellan tavlor, så fråga skolans IT om du inte vet hur din fungerar. Tryck sedan på Tavelläge när övningen visas för att få stor text.</p></details>
<details><summary>Vad säger forskningen?</summary>
<p class="note"><b>Aktiva pauser</b> (vakna, bränna energi): översikter tyder på att korta rörelsepauser i klassrummet kan förbättra uppmärksamhet och arbetsro, men studierna skiljer sig åt och mer forskning behövs. Effekten på kognitiva funktioner och kondition är oklar.</p>
<p class="note"><b>Lugna pauser</b> (andning och uppmärksamhet): evidensen är blandad. Vissa översikter ser förbättringar av uppmärksamhet, andra bara mycket små effekter.</p>
<p class="note"><b>Viktigt:</b> studierna gäller upplägget i stort, inte just de här övningarna. Övningarna i appen är inte själva utvärderade i forskning och är exempel som läraren kan anpassa.</p>
<p class="note">Källor att läsa själv:<br>
<a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11822862/" target="_blank" rel="noopener">Effectiveness of school-based active breaks on classroom behavior, executive functions and physical fitness (systematisk översikt)</a><br>
<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9219312" target="_blank" rel="noopener">Ruhland &amp; Lange (2021): Effect of classroom-based physical activity interventions on attention and on-task behavior</a><br>
<a href="https://thecommunityguide.org/findings/physical-activity-classroom-based-physical-activity-break-interventions" target="_blank" rel="noopener">The Community Guide: Classroom-based physical activity break interventions</a><br>
<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9524483/" target="_blank" rel="noopener">Mindfulness-based school interventions: a systematic review of outcome evidence quality (2022)</a></p></details>
<p class="fine">Ingen tävling och inga kroppsmått. Alla deltar efter förmåga, och varje övning har ett sätt att vara med sittande.</p>`},
ex(){const e=S.cur;if(!e)return V.setup();const t=S.timer;
const need=S.tid>Math.max(...e.tider);
const head=`<div class="card"><div class="exhead ${e.mal}"><h2>${e.namn}</h2><p>${MAL[e.mal].n} · ${e.mal==='lugna'?'lugn paus':'aktiv paus'} · ${PLATS[e.krav].n}${e.miljo?' · natur och miljö':''}</p></div>${mapMini()}`;
const art=`<div class="art"><svg class="scene ${S.artPaused?'paused':''}" viewBox="0 0 320 200" style="--tempo:${S.tempo}" role="img" aria-label="${ALT[e.id]||e.namn}">${sceneMarkup(e)}</svg><button class="link hide-board" data-act="artpause">Pausa eller spela bilden</button><div class="tempo hide-board"><span>Tempo:</span>${[[1,'Normalt'],[1.8,'Lugnt'],[2.6,'Extra lugnt']].map(q=>`<button class="chip tchip ${S.tempo===q[0]?'on':''}" data-tempo="${q[0]}" aria-pressed="${S.tempo===q[0]}">${q[1]}</button>`).join('')}<button class="chip tchip ${S.sound?'on':''}" data-sound="1" aria-pressed="${S.sound}">Ljud: ${S.sound?'På':'Av'}</button><button class="chip tchip ${S.music?'on':''}" data-music="1" aria-pressed="${S.music}">Musik: ${S.music?'På':'Av'}</button></div></div>`;
const steps=`<ol class="steg">${e.steg.map((x,j)=>`<li data-st="${j}"><button class="stbtn" data-st="${j}">${x}</button></li>`).join('')}</ol><p class="hint hide-board">Tryck på ett steg för att se rörelsen igen.</p>`;
if(t&&t.done)return head+`<div class="done"><h2>Tack, nu är pausen slut</h2><p>Sätt er ner och andas ut.</p></div><button class="btn2 starbtn" data-act="star" ${S.starGiven?'disabled':''}>${S.starGiven?'⭐ Klar!':'⭐ Klar! Gå vidare på kartan'}</button><div class="row" style="margin-top:14px"><button class="btn2" data-act="again">Samma igen</button><button class="btn2" data-act="other">Annan övning</button></div><div class="row hide-board" style="margin-top:10px"><button class="btn2" data-act="back">Nya val</button></div></div>`;
if(t)return head+`<div class="exgrid">${art}<div><div class="clock" id="clock" role="timer" aria-live="off">${mmss(t.left)}</div>${steps}<div class="row"><button class="btn2" data-act="pause">${t.paused?'Fortsätt':'Pausa'}</button><button class="btn2" data-act="stop">Stoppa</button></div></div></div></div>`;
return head+`<div class="exgrid">${art}<div>${steps}${need?`<p class="note">Övningen räcker ungefär ${Math.max(...e.tider)} minuter. Upprepa den och låt barnen hitta på egna varianter tills tiden är slut.</p>`:''}<div class="alla"><b>Så kan alla vara med</b><br>${e.alla}</div><button class="btn" data-act="start">Starta ${S.tid} minuter</button><button class="btn2 starbtn" data-act="star" ${S.starGiven?'disabled':''}>${S.starGiven?'⭐ Klar!':'⭐ Klar! Gå vidare på kartan'}</button><div class="row" style="margin-top:10px"><button class="btn2" data-act="other">Annan övning</button><button class="btn2 hide-board" data-act="back">Ändra val</button></div></div></div></div>`}
};
function render(){
  const app=$('#app');
  let h=S.screen==='setup'?V.setup():S.screen==='album'?albumScreen():V.ex();
  if(S.screen==='ex'&&!S.board)h+=`<div style="text-align:center"><button class="link" data-act="board">Tavelläge</button></div>`;
  app.innerHTML=h+(S.board?'<button class="xbtn" data-act="exitboard">Stäng tavelläge</button>':'')+(S.reveal?revealBox():S.viewCard!=null?cardView():S.mission?missionBox():S.celebrate?worldBox():'');
  window.scrollTo(0,0);
  if(S.screen==='ex'&&S.cur&&!(S.timer&&S.timer.done))mountAnim();
  if(S.screen==='setup'&&!S.celebrate&&!S.reveal)animMap();
  syncMusic()}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-act=flipcard]');if(!b)return;const d=b.dataset;if(S.sound||S.music)ac();
  if(d.tid){S.tid=+d.tid;save('lp_val',{tid:S.tid,mal:S.mal,plats:S.plats,miljo:S.miljo});render();return}
  if(d.mal){S.mal=d.mal;save('lp_val',{tid:S.tid,mal:S.mal,plats:S.plats,miljo:S.miljo});render();return}
  if(d.plats!==undefined){S.plats=+d.plats;save('lp_val',{tid:S.tid,mal:S.mal,plats:S.plats,miljo:S.miljo});render();return}
  if(d.miljo){S.miljo=!S.miljo;save('lp_val',{tid:S.tid,mal:S.mal,plats:S.plats,miljo:S.miljo});render();return}
  if(d.mood){S.mal=d.mood;S.skip=[];S.cur=pick();if(S.cur){markUsed(S.cur);S.screen='ex';stopTimer();ANIM.t=0;S.starGiven=false;S.celebrate=false;render()}return}
  if(d.trip){S.trip.type=d.trip;save('lp_trip',S.trip);render();return}
  if(d.goal){S.trip.goal=+d.goal;if(S.trip.stars>=S.trip.goal)S.trip.stars=S.trip.goal-1;S.tripShown=S.trip.stars;save('lp_trip',S.trip);render();return}
  if(d.music){S.music=!S.music;save('lp_music',S.music);if(S.music)ac();render();return}
  if(d.sound){S.sound=!S.sound;save('lp_sound',S.sound);if(S.sound)sfx('step');render();return}
  if(d.tempo){S.tempo=+d.tempo;save('lp_tempo',S.tempo);render();return}
  if(d.st!==undefined){const j=+d.st;if(ANIM.bounds[j]){ANIM.t=ANIM.bounds[j][0]+40;S.artPaused=false;ANIM.paused=false;const sv=document.querySelector('.scene');if(sv)sv.classList.remove('paused');drawAt(ANIM.t)}return}
  if(d.card!==undefined){const id=+d.card;if(S.album[id]){S.viewCard=id;render()}return}
  const a=d.act;if(!a)return;
  if(a==='find'){S.cur=pick();ANIM.t=0;S.starGiven=false;S.screen='ex';stopTimer();render();return}
  if(a==='other'){stopTimer();if(S.cur){unmarkUsed();S.skip.push(S.cur.id)}S.cur=pick();if(S.cur)markUsed(S.cur);ANIM.t=0;S.starGiven=false;render();return}
  if(a==='back'){stopTimer();S.screen='setup';render();return}
  if(a==='start'||a==='again'){if(a==='again')S.starGiven=false;startTimer();return}
  if(a==='pause'){pauseTimer();return}
  if(a==='stop'){stopTimer();render();return}
  if(a==='star'){if(S.starGiven)return;S.starGiven=true;ensureWeek();const m=S.map,ti=todayIdx();stopTimer();S.screen='setup';if(!m.done[ti]){m.done[ti]=true;const id=m.world*5+ti;S.reveal={id:id,flipped:false,dup:!!S.album[id]};S.album[id]=1;save('lp_album',S.album);S.afterReveal=(ti===4);sfx('step')}else{m.bonus=(m.bonus||0)+1;sfx('step')}save('lp_map',m);render();return}
  if(a==='flipcard'){if(!S.reveal||S.reveal.flipped)return;S.reveal.flipped=true;const el=document.querySelector('.flip');if(el)el.classList.add('on');const d=S.reveal.id%5;sfx(d===4?'fanfare':'ping');setTimeout(()=>{const t=document.getElementById('rvt'),b=document.getElementById('keepb'),v=document.getElementById('rvs'),c=document.getElementById('cfw');if(!S.reveal)return;if(t)t.textContent=S.reveal.dup?'Ni har redan den här vännen. Ny dag, samma kompis!':'Nytt kort: '+CARDS[S.reveal.id].name+'!';if(b)b.hidden=false;if(v)v.hidden=false;if(c)c.innerHTML=cfHTML(28)},520);return}
  if(a==='keepcard'){S.reveal=null;if(S.afterReveal){S.celebrate=true;S.afterReveal=false;sfx('fanfare')}render();return}
  if(a==='mission'){S.mission=true;render();return}
  if(a==='missionclose'){S.mission=false;render();return}
  if(a==='missionseen'){if(S.lastMission){S.lastMission.seen=true;save('lp_mission',S.lastMission)}render();return}
  if(a==='missiondone'){ensureWeek();const m=S.map;S.mission=false;stopTimer();S.screen='setup';if(!m.done[4]){m.done[4]=true;const id=m.world*5+4;S.reveal={id:id,flipped:false,dup:!!S.album[id]};S.album[id]=1;save('lp_album',S.album);S.afterReveal=true;S.lastMission={week:m.week,world:m.world,seen:false};save('lp_mission',S.lastMission);save('lp_map',m);sfx('step')}render();return}
  if(a==='album'){S.screen='album';render();return}
  if(a==='backmap'){S.screen='setup';render();return}
  if(a==='closecard'){S.viewCard=null;render();return}
  if(a==='closeworld'){S.celebrate=false;render();return}
  if(a==='resetmap'){if(!S.resetArm){S.resetArm=true;render();setTimeout(()=>{if(S.resetArm){S.resetArm=false;if(S.screen==='setup')render()}},4000);return}S.resetArm=false;S.map.done=[false,false,false,false,false];S.map.bonus=0;S.mapShown=null;save('lp_map',S.map);render();return}
  if(a==='artpause'){S.artPaused=!S.artPaused;ANIM.paused=S.artPaused;const sv=document.querySelector('.scene');if(sv)sv.classList.toggle('paused',S.artPaused);return}
  if(a==='board'){enterBoard();return}
  if(a==='exitboard'){exitBoard();return}});
render();
